<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contadores especiales</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&family=Mountains+of+Christmas&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    color: white;
    font-family: 'Playfair Display', serif;
}

section {
    position: relative;
    min-height: 100vh;
    padding: 60px 20px;
    text-align: center;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 1.5s ease-in-out;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3em;
}

.contador {
    font-size: 1.6em;
}

/* SECCIONES */
.romantica { background-image: url("/imagenes/1.jpg"); }
.romantica2 { background-image: url("/imagenes/7.jpg"); }
.navidad { background-image: url("/imagenes/13.jpg"); }

.navidad h1 {
    font-family: 'Mountains of Christmas', cursive;
    color: gold;
}

/* FLOTANTES */
.flotante {
    position: absolute;
    animation: flotar linear infinite;
    opacity: 0.8;
    pointer-events: none;
}

@keyframes flotar {
    from { transform: translateY(110vh); }
    to { transform: translateY(-120vh); }
}

/* MÓVIL */
@media (max-width: 768px) {
    h1 { font-size: 2.2em; }
    .contador { font-size: 1.3em; }
}
</style>
</head>

<body>

<section class="romantica">
    <h1>🤍 ¿Sabías el tiempo exacto que llevamos juntos? 🤍</h1>
    <div id="contador1" class="contador"></div>
</section>

<section class="romantica2">
    <h1>Desde que te creíste que soy del Athletic</h1>
    <div id="contador2" class="contador"></div>
</section>

<section class="navidad">
    <h1>🎄 Tiempo que falta para Navidad 🎄</h1>
    <div id="contadorNavidad" class="contador"></div>
</section>

<script>
const fecha1 = new Date(2025, 8, 30, 14, 35);
const fecha2 = new Date(2025, 7, 14, 19, 0);

function contarDesde(fecha, id) {
    const ahora = new Date();
    let s = Math.floor((ahora - fecha) / 1000);
    if (s < 0) return;

    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60); s %= 60;

    document.getElementById(id).textContent =
        `${d} días, ${h} horas, ${m} minutos y ${s} segundos`;
}

function actualizarNavidad() {
    const ahora = new Date();
    let navidad = new Date(ahora.getFullYear(), 11, 25);
    if (ahora > navidad) navidad.setFullYear(navidad.getFullYear() + 1);

    let s = Math.floor((navidad - ahora) / 1000);
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60); s %= 60;

    document.getElementById("contadorNavidad").textContent =
        `${d} días, ${h} horas, ${m} minutos y ${s} segundos`;
}

function rotarFondos(seccion, inicio, fin) {
    let i = inicio;
    setInterval(() => {
        seccion.style.backgroundImage = `url("/imagenes/${i}.jpg")`;
        i = i < fin ? i + 1 : inicio;
    }, 3000);
}

setInterval(() => {
    contarDesde(fecha1, "contador1");
    contarDesde(fecha2, "contador2");
    actualizarNavidad();
}, 1000);

rotarFondos(document.querySelector(".romantica"), 1, 6);
rotarFondos(document.querySelector(".romantica2"), 7, 12);
</script>

</body>
</html>
